name: CI

on:
  push:
    branches:
      - main
      - develop
      - '0*'
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages
        run: nuget restore SistemaBoletosAutobus.sln -NonInteractive

      - name: Build solution
        run: msbuild SistemaBoletosAutobus.sln /m /p:Configuration=Release

      - name: Run tests
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vstest = & $vswhere -latest -products * -find "**\TestPlatform\vstest.console.exe" | Select-Object -First 1
          Write-Host "VSTest: $vstest"
          & $vstest .\SistemaBoletosAutobus.Tests\bin\Release\SistemaBoletosAutobus.Tests.dll /Settings:SistemaBoletosAutobus.runsettings /Logger:trx /ResultsDirectory:TestResults
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          if-no-files-found: warn
